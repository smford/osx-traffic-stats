name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Create prerelease'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-latest

    steps:
      - name: Determine version
        id: semver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          # Ensure tag starts with 'v'
          if [[ "$TAG" != v* ]]; then
            TAG="v${TAG}"
          fi

          # Clean version without leading 'v'
          CLEAN_VER="${TAG#v}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "Building SemVer release: $TAG ($CLEAN_VER)"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run static analysis
        run: make vet

      - name: Run unit tests
        run: make test

      - name: Package Universal macOS App & Binary
        run: |
          make package VERSION="${{ steps.semver.outputs.version }}"
          cd bin
          shasum -a 256 *.zip *.tar.gz > "checksums.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: ${{ steps.semver.outputs.tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            bin/OSXTrafficStats-${{ steps.semver.outputs.tag }}-macOS.zip
            bin/osx-traffic-stats-${{ steps.semver.outputs.tag }}-darwin-universal.tar.gz
            bin/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
