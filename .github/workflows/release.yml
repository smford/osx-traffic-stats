name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump strategy (auto, patch, minor, major)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      custom_version:
        description: 'Explicit version override (e.g. 1.2.3 or v1.2.3), takes precedence if set'
        required: false
        default: ''
        type: string
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Create prerelease'
        type: boolean
        default: false

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  CGO_CFLAGS: "-mmacosx-version-min=11.0"
  CGO_LDFLAGS: "-mmacosx-version-min=11.0"

jobs:
  test:
    name: Test & Verify
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run static analysis
        run: make vet

      - name: Run unit tests
        run: make test

  release:
    name: Build & Publish Release
    needs: [test]
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Determine Release Version
        id: version
        run: |
          # Fetch all tags so we know all existing release versions
          git fetch --tags --force

          # Check if custom_version input is specified
          CUSTOM_VER="${{ github.event.inputs.custom_version }}"
          if [ -n "$CUSTOM_VER" ]; then
            if [[ "$CUSTOM_VER" != v* ]]; then
              TAG_NAME="v${CUSTOM_VER}"
              VERSION="${CUSTOM_VER}"
            else
              TAG_NAME="${CUSTOM_VER}"
              VERSION="${CUSTOM_VER#v}"
            fi
            echo "Using custom version override: ${TAG_NAME}"
            echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If triggered by a tag push (refs/tags/v*), use that tag directly
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
            echo "Triggered by tag push: ${TAG_NAME}"
            echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MANUAL_BUMP="${{ github.event.inputs.bump }}"

          # Check if current HEAD is already tagged with a semver release tag
          CURRENT_TAG=$(git tag --points-at HEAD "v[0-9]*.[0-9]*.[0-9]*" | head -n 1)
          if [ -n "$CURRENT_TAG" ] && [ "$MANUAL_BUMP" != "patch" ] && [ "$MANUAL_BUMP" != "minor" ] && [ "$MANUAL_BUMP" != "major" ]; then
            echo "HEAD is already tagged as $CURRENT_TAG and no manual bump requested. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find the latest semantic version tag
          LATEST_TAG=$(git tag -l "v*" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)
          echo "Latest existing tag: ${LATEST_TAG:-none}"

          if [ -z "$LATEST_TAG" ]; then
            # Initial release version baseline
            NEW_VERSION="1.0.0"
          else
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)

            BUMP="patch"
            if [ -n "$MANUAL_BUMP" ] && [ "$MANUAL_BUMP" != "auto" ]; then
              BUMP="$MANUAL_BUMP"
            else
              COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s%n%b")
              if echo "$COMMITS" | grep -qE "(BREAKING CHANGE|breaking:|^[a-zA-Z]+(\([a-zA-Z0-9_-]+\))?!:)"; then
                BUMP="major"
              elif echo "$COMMITS" | grep -qE "^feat(\([a-zA-Z0-9_-]+\))?:"; then
                BUMP="minor"
              fi
            fi

            case "$BUMP" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          TAG_NAME="v${NEW_VERSION}"
          echo "Next release version: ${NEW_VERSION}"
          echo "Next release tag: ${TAG_NAME}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Package Universal macOS App & Binary
        if: steps.version.outputs.skip != 'true'
        run: |
          make package VERSION="${{ steps.version.outputs.version }}"
          cd bin
          shasum -a 256 "OSXTrafficStats-${{ steps.version.outputs.tag }}-macOS.zip" "osx-traffic-stats-${{ steps.version.outputs.tag }}-darwin-universal.tar.gz" > checksums.txt

      - name: Generate Homebrew Formula and Cask
        if: steps.version.outputs.skip != 'true'
        run: |
          chmod +x scripts/generate_formula.sh
          ./scripts/generate_formula.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.tag }}" "bin" "bin/osx-traffic-stats.rb" "bin/osx-traffic-stats-cask.rb"

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          DRAFT: ${{ github.event.inputs.draft }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          FLAGS=()
          if [ "$DRAFT" = "true" ]; then
            FLAGS+=(--draft)
          fi
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi

          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            "${FLAGS[@]}" \
            bin/OSXTrafficStats-${TAG_NAME}-macOS.zip \
            bin/osx-traffic-stats-${TAG_NAME}-darwin-universal.tar.gz \
            bin/checksums.txt \
            bin/osx-traffic-stats.rb \
            bin/osx-traffic-stats-cask.rb

      - name: Publish Homebrew Cask to Tap
        if: steps.version.outputs.skip != 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          if [ -n "${TAP_TOKEN}" ]; then
            echo "Publishing updated cask to smford/homebrew-tap..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git clone "https://x-access-token:${TAP_TOKEN}@github.com/smford/homebrew-tap.git" tap_repo
            mkdir -p tap_repo/Casks
            rm -f tap_repo/Formula/osx-traffic-stats.rb
            cp bin/osx-traffic-stats-cask.rb tap_repo/Casks/osx-traffic-stats.rb
            cd tap_repo
            git add -A Formula/ Casks/
            if git commit -m "feat: update osx-traffic-stats cask to ${TAG_NAME}"; then
              git push origin main
              echo "Successfully pushed cask update to smford/homebrew-tap"
            else
              echo "Cask in tap is already up to date"
            fi
            cd ..
            rm -rf tap_repo
          else
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN secret is not set. Cask available in release assets."
          fi
