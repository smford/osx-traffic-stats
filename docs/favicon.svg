<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 10 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="wmCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <linearGradient id="wmViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <mask id="wmMask">
      <rect width="920" height="180" fill="white" />
      <path d="M 35,130 C 70,130 85,50 135,50 L 148,50" fill="none" stroke="black" stroke-width="26" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- Mini Stat/Traffic Vector Mark (Left) -->
  <g transform="translate(10, 0)">
    <!-- Violet Path -->
    <path d="M 35,50 C 70,50 85,130 135,130 L 148,130" fill="none" stroke="url(#wmViolet)" stroke-width="16" stroke-linecap="round" mask="url(#wmMask)" />
    <path d="M 138,112 L 165,130 L 138,148 Z" fill="url(#wmViolet)" mask="url(#wmMask)" />

    <!-- Cyan Path -->
    <path d="M 35,130 C 70,130 85,50 135,50 L 148,50" fill="none" stroke="url(#wmCyan)" stroke-width="16" stroke-linecap="round" />
    <path d="M 138,32 L 165,50 L 138,68 Z" fill="url(#wmCyan)" />
  </g>
</svg>
